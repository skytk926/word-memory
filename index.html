<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>N2 词汇 · 互联背词</title>
<style>
  :root {
    --bg: #f4f7fd;
    --bg-2: #eef2fb;
    --panel: rgba(15, 23, 42, 0.04);
    --panel-solid: #ffffff;
    --border: rgba(15, 23, 42, 0.10);
    --text: #1b2437;
    --dim: #56627a;
    --faint: #8a97ad;
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --accent-3: #0891b2;
    --glow: rgba(37, 99, 235, 0.35);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(124, 58, 237, 0.10), transparent 60%),
      radial-gradient(1000px 600px at -10% 20%, rgba(37, 99, 235, 0.10), transparent 55%),
      radial-gradient(900px 500px at 50% 120%, rgba(8, 145, 178, 0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- animated network background ---------- */
  #net {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: 0.5;
  }

  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 28px 20px 90px; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 16px; padding: 6px 4px 24px;
  }
  .brand h1 {
    font-size: 30px; font-weight: 800; letter-spacing: 0.5px; line-height: 1.1;
    background: linear-gradient(120deg, #2563eb 0%, #7c3aed 55%, #0891b2 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .brand .sub { margin-top: 7px; color: var(--dim); font-size: 13.5px; }
  .brand .sub b { color: var(--accent); font-weight: 600; }
  .stat {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
  }
  .stat .pill {
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 9px 15px; font-size: 13px; color: var(--dim);
  }
  .stat .pill b { color: var(--text); font-weight: 700; font-size: 15px; margin-right: 4px; }

  /* ---------- search ---------- */
  .searchbar {
    position: sticky; top: 12px; z-index: 30; margin: 0 0 20px;
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 14px; padding: 10px 16px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
  }
  .searchbar svg { flex: none; opacity: 0.6; }
  .searchbar input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    font-size: 15px; min-width: 0;
  }
  .searchbar input::placeholder { color: var(--faint); }
  .searchbar .clear {
    flex: none; border: none; background: var(--panel); color: var(--dim);
    width: 26px; height: 26px; border-radius: 8px; cursor: pointer; font-size: 14px;
    display: none; align-items: center; justify-content: center;
  }

  /* ---------- category network nav ---------- */
  .cats {
    display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 26px;
    align-items: center;
  }
  .cat {
    --c: #38bdf8;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 999px; padding: 9px 15px; cursor: pointer;
    font-size: 14px; color: var(--dim); transition: all .18s ease;
    position: relative; user-select: none;
  }
  .cat .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent);
    flex: none;
  }
  .cat .n { font-size: 11.5px; color: var(--faint); }
  .cat:hover { color: var(--text); border-color: color-mix(in srgb, var(--c) 55%, transparent); transform: translateY(-1px); }
  .cat.active {
    color: #101a30; background: color-mix(in srgb, var(--c) 16%, #ffffff);
    border-color: var(--c); box-shadow: 0 4px 16px color-mix(in srgb, var(--c) 30%, transparent);
  }
  .cat.active .n { color: color-mix(in srgb, var(--c) 55%, #1b2437); }
  .cat-group {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .cat-group + .cat-group { padding-left: 14px; border-left: 1px solid var(--border); }
  .group-label {
    font-size: 11px; letter-spacing: 1.5px; color: var(--faint); text-transform: uppercase;
    writing-mode: vertical-rl; max-height: 120px;
  }

  /* ---------- autoplay panel ---------- */
  .autoplay {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px;
    margin: 0 0 16px;
  }
  .autoplay .lbl { font-size: 12.5px; color: var(--faint); white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .seg button {
    border: none; background: transparent; color: var(--dim); font-size: 13px;
    padding: 7px 14px; cursor: pointer; transition: all .15s ease;
  }
  .seg button.on { background: var(--accent); color: #fff; }
  .autoplay input[type="number"] {
    width: 64px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 6px 8px; font-size: 13.5px; text-align: center;
  }
  .autoplay input[type="number"]::-webkit-inner-spin-button { opacity: 0.5; }
  .autoplay .range-sep { color: var(--faint); }
  .btn {
    border: 1px solid var(--border); border-radius: 9px; cursor: pointer;
    padding: 8px 16px; font-size: 13.5px; font-weight: 600; transition: all .15s ease;
    color: var(--text); background: var(--panel); white-space: nowrap;
  }
  .btn.primary {
    background: linear-gradient(120deg, #2563eb, #7c3aed); border: none; color: #fff;
  }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.stop { color: #e11d48; border-color: rgba(225, 29, 72, 0.35); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .autoplay .prog { font-size: 12.5px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .autoplay .hint { font-size: 11.5px; color: var(--faint); }

  /* number badge + playing highlight */
  .card .num {
    flex: none; font-size: 11px; color: var(--faint); font-weight: 600;
    letter-spacing: .5px; padding-top: 4px; min-width: 20px; font-variant-numeric: tabular-nums;
  }
  .card.playing { border-color: var(--c, var(--accent)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c, var(--accent)) 45%, transparent), 0 12px 28px rgba(15, 23, 42, 0.12); }

  /* ---------- word grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel-solid); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 17px 15px; position: relative; overflow: hidden;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(var(--c, var(--accent)), transparent 75%); opacity: 0.85;
  }
  .card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c, var(--accent)) 45%, transparent); box-shadow: 0 12px 28px rgba(15, 23, 42, 0.10); }

  .card .top { display: flex; align-items: flex-start; gap: 10px; }
  .word {
    flex: 1; font-size: 21px; font-weight: 700; line-height: 1.25; cursor: pointer;
    display: inline-flex; align-items: center; gap: 9px; word-break: break-word;
  }
  .word .jp { transition: color .15s ease; }
  .word:hover .jp { color: var(--c, var(--accent)); }
  .reading { color: var(--dim); font-size: 13px; margin-top: 2px; font-weight: 500; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: rgba(15, 23, 42, 0.05); color: var(--dim); border: 1px solid var(--border);
  }
  .badge.acc { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 30%, transparent); }
  .badge.pos { color: var(--accent-3); }
  .meaning { margin-top: 9px; font-size: 14.5px; color: var(--text); line-height: 1.55; }

  .example {
    margin-top: 11px; padding: 10px 12px; border-radius: 11px; cursor: pointer;
    background: rgba(15, 23, 42, 0.03); border: 1px dashed var(--border);
    transition: background .15s ease, border-color .15s ease;
  }
  .example:hover { background: rgba(15, 23, 42, 0.06); border-color: color-mix(in srgb, var(--c, var(--accent)) 40%, transparent); }
  .example .jp { font-size: 14px; line-height: 1.6; color: #2b3550; }
  .example .cn { margin-top: 6px; font-size: 12.5px; color: var(--faint); line-height: 1.5; }

  /* speaker button */
  .spk {
    flex: none; width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--c, var(--accent)) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 30%, transparent);
    color: var(--c, var(--accent)); transition: all .15s ease;
  }
  .spk:hover { background: color-mix(in srgb, var(--c, var(--accent)) 26%, transparent); }
  .spk.playing { animation: pulse .8s ease infinite; }
  .spk svg { width: 15px; height: 15px; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c, var(--accent)) 50%, transparent); } 50% { box-shadow: 0 0 0 8px transparent; } }

  .ex-label { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
  .ex-label .tag { font-size: 10.5px; letter-spacing: 1px; color: var(--faint); }

  .empty { text-align: center; color: var(--faint); padding: 60px 20px; font-size: 15px; }

  /* ---------- edit button ---------- */
  .edit-btn {
    position: absolute; top: 10px; right: 10px; width: 26px; height: 26px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--panel-solid);
    color: var(--dim); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; opacity: 0.5;
    transition: opacity .15s ease, color .15s ease, border-color .15s ease;
  }
  .card:hover .edit-btn { opacity: 1; }
  .edit-btn:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .edit-btn.active { opacity: 1; color: #16a34a; border-color: color-mix(in srgb, #16a34a 40%, transparent); }
  .badge.edited { color: #16a34a; border-color: color-mix(in srgb, #16a34a 35%, transparent); background: color-mix(in srgb, #16a34a 10%, transparent); }

  /* ---------- edit toolbar ---------- */
  .editbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
  .editbar .hint { font-size: 12px; color: var(--faint); flex: 1; min-width: 220px; line-height: 1.5; }
  .editbar code { font-size: 11.5px; background: rgba(15,23,42,0.06); padding: 1px 5px; border-radius: 5px; }

  /* ---------- edit modal ---------- */
  .modal-mask {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(3px);
  }
  .modal {
    background: var(--panel-solid); border: 1px solid var(--border); border-radius: 16px;
    width: 100%; max-width: 520px; max-height: 88vh; overflow: auto;
    box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25); padding: 18px 20px 20px;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .modal-title { font-size: 15px; font-weight: 700; }
  .modal-close { border: none; background: var(--panel); color: var(--dim); width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .modal-close:hover { color: var(--text); }
  .modal-body { display: flex; flex-direction: column; gap: 11px; }
  .modal-body label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--dim); }
  .modal-body label .hint { font-weight: 400; color: var(--faint); }
  .modal-body input, .modal-body textarea {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-size: 14px; padding: 9px 11px; outline: none;
    font-family: inherit; resize: vertical; min-height: 38px;
  }
  .modal-body textarea { min-height: 58px; }
  .modal-body input:focus, .modal-body textarea:focus { border-color: var(--accent); background: #fff; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

  footer { margin-top: 50px; text-align: center; color: var(--faint); font-size: 12px; line-height: 1.7; }
  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 640px) {
    .brand h1 { font-size: 24px; }
    .grid { grid-template-columns: 1fr; }
    .cat-group + .cat-group { padding-left: 0; border-left: none; }
    .group-label { writing-mode: horizontal-tb; max-height: none; }
  }
</style>
</head>
<body>
<canvas id="net"></canvas>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>N2 词汇 · 互联背词</h1>
      <div class="sub">点击 <b>单词</b> 或 <b>例句</b> 即可发音 · 共 <b id="totalWords">0</b> 词</div>
    </div>
    <div class="stat">
      <div class="pill"><b id="statCat">6</b> 个分类</div>
      <div class="pill"><b id="statCur">0</b> 当前分类</div>
    </div>
  </header>

  <div class="searchbar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="搜索单词 / 假名 / 释义…（回车可清空）" autocomplete="off">
    <button class="clear" id="clearBtn" title="清空">✕</button>
  </div>

  <div class="editbar">
    <span class="hint">发现缺读音 / 释义或例句翻译有误？点卡片右上角 ✎ 修改，改完点「导出修改」，把 <code>manual_overrides.json</code> 放进项目目录，再运行 <code>python3 finalize.py &amp;&amp; python3 gen_audio.py</code> 重新生成数据与音频。</span>
    <button class="btn" id="exportBtn">导出修改</button>
    <button class="btn" id="ovClear" style="display:none">清除本地修改</button>
  </div>

  <div class="autoplay">
    <span class="lbl">自动播放</span>
    <div class="seg" id="modeSeg">
      <button data-mode="all" class="on">全部</button>
      <button data-mode="range">范围</button>
    </div>
    <span class="lbl" id="rangeLbl" style="display:none">编号</span>
    <input type="number" id="rangeFrom" min="1" value="1" style="display:none">
    <span class="range-sep" id="rangeSep" style="display:none">–</span>
    <input type="number" id="rangeTo" min="1" value="1" style="display:none">
    <span class="lbl">重复</span>
    <input type="number" id="repeat" min="1" max="10" value="1">
    <span class="lbl">次</span>
    <button class="btn primary" id="autoStart">▶ 开始</button>
    <button class="btn stop" id="autoStop" disabled>■ 停止</button>
    <span class="prog" id="autoProg"></span>
    <span class="hint" id="autoHint"></span>
  </div>

  <nav class="cats" id="cats"></nav>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的单词</div>

  <footer>
    数据来源：N2 词汇王炸套餐背词版（OCR 提取，部分内容可能有识别误差）<br>
    发音由 macOS 语音合成（Kyoko 日语声）离线生成 · 音频存放于 <code>audio/</code> 目录
  </footer>
</div>

<div class="modal-mask" id="editMask">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="editTitle">编辑</span>
      <button class="modal-close" id="editClose">✕</button>
    </div>
    <div class="modal-body">
      <label>单词<input id="fW" type="text"></label>
      <label>读音 / 假名<span class="hint">单词发音以此为准</span><input id="fR" type="text"></label>
      <label>声调<input id="fA" type="text"></label>
      <label>词性<input id="fP" type="text"></label>
      <label>释义<textarea id="fM" rows="2"></textarea></label>
      <label>例句（日文）<span class="hint">例句发音以此为准</span><textarea id="fE" rows="2"></textarea></label>
      <label>例句释义（中文）<textarea id="fEc" rows="2"></textarea></label>
    </div>
    <div class="modal-foot">
      <button class="btn" id="editCancel">取消</button>
      <button class="btn primary" id="editSave">保存</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
/* ============ data ============ */
const CAT_COLORS = {
  basic: '#38bdf8',
  kanji: '#a78bfa',
  verb:  '#f472b6',
  adj:   '#34d399',
  loan:  '#fbbf24',
  adv:   '#22d3ee',
};

const sections = SECTIONS.map((s, i) => ({
  ...s,
  id: s.id,
  color: CAT_COLORS[s.id] || '#38bdf8',
  label: s.parent === '核心词汇' ? '核心 · ' + s.title : s.title,
}));

/* ============ state ============ */
let activeId = sections[0].id;
let query = '';

/* ============ manual overrides (browser editing) ============ */
let overrides = {};
try { overrides = JSON.parse(localStorage.getItem('wm_overrides') || '{}'); } catch (e) { overrides = {}; }
function saveOverrides() { localStorage.setItem('wm_overrides', JSON.stringify(overrides)); }
function overrideCount() { return Object.keys(overrides).length; }
function wk(w) { return w.k || (w.wa || '').replace(/^audio\//, '').replace(/\.m4a$/, ''); }
function effectiveWord(w) { const o = overrides[wk(w)]; return o ? { ...w, ...o } : w; }

/* ============ audio ============ */
let current = null;
function playAudio(url, btn) {
  if (!url) return;
  stopAuto();
  if (current) { current.pause(); current = null; }
  const a = new Audio(url);
  current = a;
  document.querySelectorAll('.spk.playing').forEach(el => el.classList.remove('playing'));
  if (btn) btn.classList.add('playing');
  a.onended = () => { if (btn) btn.classList.remove('playing'); };
  a.onerror = () => { if (btn) btn.classList.remove('playing'); };
  a.play().catch(() => { if (btn) btn.classList.remove('playing'); });
}

/* ============ render ============ */
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const totalWords = document.getElementById('totalWords');
const statCur = document.getElementById('statCur');
const statCat = document.getElementById('statCat');

function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function wordCard(w, sec, idx) {
  const ww = effectiveWord(w);
  const k = wk(w);
  const edited = !!overrides[k];
  const badges = [];
  if (ww.a) badges.push(`<span class="badge acc">声调 ${esc(ww.a)}</span>`);
  if (ww.p) badges.push(`<span class="badge pos">${esc(ww.p)}</span>`);
  if (edited) badges.push(`<span class="badge edited">已改</span>`);

  const exHtml = ww.e
    ? `<div class="example" onclick="playAudio('${esc(ww.ea)}', this.querySelector('.spk'))">
         <div class="ex-label"><span class="tag">例句</span><span class="spk"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8a5 5 0 010 8M18.5 5.5a9 9 0 010 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></div>
         <div class="jp">${esc(ww.e)}</div>
         ${ww.ec ? `<div class="cn">${esc(ww.ec)}</div>` : ''}
       </div>`
    : '';

  return `<div class="card" data-idx="${idx}" style="--c:${sec.color}">
    <button class="edit-btn ${edited ? 'active' : ''}" data-k="${esc(k)}" title="编辑">✎</button>
    <div class="top">
      <span class="num">${idx + 1}</span>
      <div class="word" onclick="playAudio('${esc(ww.wa)}', this.querySelector('.spk'))">
        <span class="jp">${esc(ww.w)}</span>
        <span class="spk"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8a5 5 0 010 8M18.5 5.5a9 9 0 010 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
      </div>
    </div>
    ${ww.r ? `<div class="reading">${esc(ww.r)}</div>` : ''}
    ${badges.length ? `<div class="badges">${badges.join('')}</div>` : ''}
    ${ww.m ? `<div class="meaning">${esc(ww.m)}</div>` : ''}
    ${exHtml}
  </div>`;
}

function matches(w, q) {
  if (!q) return true;
  const ww = effectiveWord(w);
  const hay = (ww.w + ' ' + ww.r + ' ' + ww.m + ' ' + ww.e + ' ' + ww.ec).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function render() {
  const sec = sections.find(s => s.id === activeId);
  const words = sec.words.filter(w => matches(w, query));
  grid.innerHTML = words.map((w, i) => wordCard(w, sec, i)).join('');
  grid.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openEdit(btn.dataset.k));
  });
  empty.style.display = words.length ? 'none' : 'block';
  statCur.textContent = words.length;
  document.getElementById('search').placeholder = `在「${sec.label}」中搜索（${sec.words.length} 词）…`;
}

/* ============ nav ============ */
const catsEl = document.getElementById('cats');
function renderNav() {
  const groups = {};
  sections.forEach(s => { (groups[s.parent] = groups[s.parent] || []).push(s); });
  let html = '';
  for (const [parent, secs] of Object.entries(groups)) {
    const chips = secs.map(s =>
      `<div class="cat ${s.id === activeId ? 'active' : ''}" data-id="${s.id}" style="--c:${s.color}">
        <span class="dot"></span>${esc(s.label)}<span class="n">${s.words.length}</span>
      </div>`).join('');
    html += `<div class="cat-group"><span class="group-label">${esc(parent)}</span>${chips}</div>`;
  }
  catsEl.innerHTML = html;
  catsEl.querySelectorAll('.cat').forEach(el => {
    el.addEventListener('click', () => {
      stopAuto();
      activeId = el.dataset.id;
      renderNav(); render();
      updateAutoHint();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/* ============ search ============ */
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
searchInput.addEventListener('input', () => {
  stopAuto();
  query = searchInput.value.trim();
  clearBtn.style.display = query ? 'flex' : 'none';
  render();
});
clearBtn.addEventListener('click', () => { searchInput.value = ''; query = ''; clearBtn.style.display = 'none'; render(); });
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') { searchInput.value = ''; query = ''; clearBtn.style.display = 'none'; render(); } });

/* ============ autoplay ============ */
const modeSeg = document.getElementById('modeSeg');
const rangeLbl = document.getElementById('rangeLbl');
const rangeFrom = document.getElementById('rangeFrom');
const rangeTo = document.getElementById('rangeTo');
const rangeSep = document.getElementById('rangeSep');
const repeatInput = document.getElementById('repeat');
const autoStart = document.getElementById('autoStart');
const autoStop = document.getElementById('autoStop');
const autoProg = document.getElementById('autoProg');
const autoHint = document.getElementById('autoHint');

let autoMode = 'all';
let autoRunning = false;
let autoToken = 0;
let autoAudio = null;
let autoResolve = null;

function updateAutoHint() {
  const sec = sections.find(s => s.id === activeId);
  const n = sec.words.length;
  autoHint.textContent = `本类共 ${n} 词（编号 1–${n}）`;
  rangeTo.max = n; rangeFrom.max = n;
  rangeTo.value = String(Math.min(parseInt(rangeTo.value, 10) || n, n));
  rangeTo.min = 1; rangeFrom.min = 1;
}

function setRunning(on) {
  autoRunning = on;
  autoStart.disabled = on;
  autoStop.disabled = !on;
  modeSeg.querySelectorAll('button').forEach(b => b.disabled = on);
  rangeFrom.disabled = rangeTo.disabled = repeatInput.disabled = on;
}

function highlightCard(idx) {
  grid.querySelectorAll('.card.playing').forEach(el => el.classList.remove('playing'));
  const el = grid.querySelector(`.card[data-idx="${idx}"]`);
  if (el) { el.classList.add('playing'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

function clearHighlight() {
  grid.querySelectorAll('.card.playing').forEach(el => el.classList.remove('playing'));
}

function stopAuto() {
  autoToken++;
  if (autoAudio) { autoAudio.pause(); autoAudio = null; }
  if (autoResolve) { const r = autoResolve; autoResolve = null; r(); }
  setRunning(false);
  clearHighlight();
  autoProg.textContent = '';
}

function playOnce(url) {
  return new Promise(resolve => {
    const a = new Audio(url);
    autoAudio = a;
    autoResolve = resolve;
    const done = () => {
      if (autoResolve === resolve) autoResolve = null;
      if (autoAudio === a) autoAudio = null;
      resolve();
    };
    a.onended = done;
    a.onerror = done;
    a.play().catch(done);
  });
}

function delay(ms) {
  return new Promise(resolve => {
    autoResolve = resolve;
    setTimeout(() => { if (autoResolve === resolve) autoResolve = null; resolve(); }, ms);
  });
}

async function runAutoPlay() {
  const token = ++autoToken;
  const sec = sections.find(s => s.id === activeId);
  const n = sec.words.length;
  let from = 0, to = n - 1;
  if (autoMode === 'range') {
    from = Math.max(0, (parseInt(rangeFrom.value, 10) || 1) - 1);
    to = Math.min(n - 1, (parseInt(rangeTo.value, 10) || n) - 1);
    if (from > to) { const t = from; from = to; to = t; }
  }
  const repeat = Math.max(1, Math.min(10, parseInt(repeatInput.value, 10) || 1));
  setRunning(true);
  const total = to - from + 1;
  let doneCount = 0;
  for (let i = from; i <= to; i++) {
    if (token !== autoToken) return;
    const w = sec.words[i];
    highlightCard(i);
    autoProg.textContent = `${i + 1} / ${n} · 第 ${doneCount + 1}/${total} 词`;
    for (let r = 0; r < repeat && token === autoToken; r++) await playOnce(w.wa);
    if (w.ea) {
      for (let r = 0; r < repeat && token === autoToken; r++) await playOnce(w.ea);
    }
    doneCount++;
    if (i < to) await delay(1000);
  }
  autoToken++;
  setRunning(false);
  clearHighlight();
  autoProg.textContent = '播放完成 ✓';
}

modeSeg.querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    autoMode = b.dataset.mode;
    modeSeg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    const range = autoMode === 'range';
    const disp = range ? 'inline-block' : 'none';
    rangeLbl.style.display = rangeSep.style.display = rangeFrom.style.display = rangeTo.style.display = disp;
  });
});

autoStart.addEventListener('click', () => {
  if (autoRunning) return;
  stopAuto();
  if (query) { query = ''; searchInput.value = ''; clearBtn.style.display = 'none'; }
  render();
  runAutoPlay();
});

autoStop.addEventListener('click', stopAuto);

/* ============ manual editing ============ */
const editMask = document.getElementById('editMask');
const editTitle = document.getElementById('editTitle');
const exportBtn = document.getElementById('exportBtn');
const ovClear = document.getElementById('ovClear');
let editKey = null;

const FIELDS = [
  ['fW', 'w'], ['fR', 'r'], ['fA', 'a'], ['fP', 'p'],
  ['fM', 'm'], ['fE', 'e'], ['fEc', 'ec'],
];

function findWord(k) {
  for (const s of sections) {
    const w = s.words.find(x => wk(x) === k);
    if (w) return w;
  }
  return null;
}

function openEdit(k) {
  const w = findWord(k);
  if (!w) return;
  editKey = k;
  const ww = effectiveWord(w);
  editTitle.textContent = `编辑 · ${ww.w}`;
  FIELDS.forEach(([id, f]) => { document.getElementById(id).value = ww[f] || ''; });
  editMask.style.display = 'flex';
  document.getElementById('fW').focus();
}

function closeEdit() { editMask.style.display = 'none'; editKey = null; }

document.getElementById('editSave').addEventListener('click', () => {
  const w = editKey && findWord(editKey);
  if (!w) return;
  const diff = {};
  FIELDS.forEach(([id, f]) => {
    const v = document.getElementById(id).value.trim();
    if (v !== (w[f] || '')) diff[f] = v;
  });
  if (Object.keys(diff).length) overrides[editKey] = diff;
  else delete overrides[editKey];
  saveOverrides();
  closeEdit();
  render();
  updateExportBtn();
});

document.getElementById('editCancel').addEventListener('click', closeEdit);
document.getElementById('editClose').addEventListener('click', closeEdit);
editMask.addEventListener('click', e => { if (e.target === editMask) closeEdit(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && editMask.style.display !== 'none') closeEdit(); });

function updateExportBtn() {
  const n = overrideCount();
  exportBtn.textContent = n ? `导出修改（${n} 处）` : '导出修改';
  ovClear.style.display = n ? 'inline-flex' : 'none';
}

exportBtn.addEventListener('click', () => {
  if (!overrideCount()) { alert('还没有任何修改'); return; }
  const blob = new Blob([JSON.stringify(overrides, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'manual_overrides.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 500);
});

ovClear.addEventListener('click', () => {
  if (!confirm('清除所有本地修改？（已导出的文件不受影响）')) return;
  overrides = {};
  saveOverrides();
  render();
  updateExportBtn();
});

/* ============ init ============ */
totalWords.textContent = sections.reduce((n, s) => n + s.words.length, 0);
statCat.textContent = sections.length;
renderNav();
render();
updateAutoHint();
updateExportBtn();
</script>

<script>
/* ============ interconnected background ============ */
(function () {
  const cv = document.getElementById('net');
  const ctx = cv.getContext('2d');
  let W, H, pts = [];
  function resize() {
    W = cv.width = window.innerWidth * devicePixelRatio;
    H = cv.height = window.innerHeight * devicePixelRatio;
    const n = Math.min(90, Math.floor(W * H / 26000));
    pts = Array.from({length: n}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
      r: 1 + Math.random() * 1.6,
      c: Math.random() < 0.6 ? '37,99,235' : '124,58,237',
    }));
  }
  function step() {
    ctx.clearRect(0, 0, W, H);
    const link = 130 * devicePixelRatio;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.c},0.5)`;
      ctx.fill();
      for (let j = i + 1; j < pts.length; j++) {
        const q = pts[j];
        const d = Math.hypot(p.x - q.x, p.y - q.y);
        if (d < link) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = `rgba(${p.c},${(1 - d / link) * 0.16})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(step);
  }
  resize(); step();
  window.addEventListener('resize', resize);
})();
</script>
